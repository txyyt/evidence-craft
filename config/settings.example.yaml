# 模板：复制为 settings.yaml 后填入真实 key（settings.yaml 已 gitignore）
stock: "000803"

http:
  timeout: 20
  retries: 2

cache:
  dir: artifacts/cache
  ttl_minutes:
    quote: 1
    financial: 1440
    announcement: 60
    consensus: 60
    peer: 60
    news: 30

artifacts_dir: artifacts

model:
  base_url: "https://api.deepseek.com"
  api_key: "<在此填入你的 DeepSeek API Key>"
  model: "deepseek-v4-flash-vision-exp"

# M7 起启用：部门数据源连接（凭据类信息只放本文件，profile 只存引用名）
databases:
  assay_db:                 # geology_demo 部门：合成钻探库（SQLite）
    path: data/geology_demo/assay.db

rag:
  endpoint: mock            # 对方 RAG 服务的真实 URL 明确后替换 "mock"


# 流水线参数（系统设置页可改）
pipeline:
  judge_threshold: 36   # judge 五维总分达到该值且无单维过低才 PASS
  revise_rounds: 2      # 评审不过时退回重写的最大轮数
