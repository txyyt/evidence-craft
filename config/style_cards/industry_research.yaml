id: industry_research
name: 券商研报体
desc: 研报形态：结论先行、数据密集、判断明确、可读性优先
rules: |
  - 结论先行：每段第一句给判断，随后用数据与事实支撑；不写"背景铺垫段"。
  - 数据密集且精确：优先引用带编号事实的具体数值（保留原文精度），同比/占比
    /规模并置；无出处数字禁写。
  - 判断词规范："我们认为"禁用（无第一人称）；改用"预计""有望""需关注"等
    客观判断词；避免"暴涨""暴跌"等情绪化表述。
  - 短句为主，一句一意；善用对比结构（"而""相比之下""对照"）突出变化与差距。
  - 每段 100~200 字；整节围绕一条主线，不旁生枝节。
excerpts:
  - kind: text
    text: |
      高端供给寡头格局短期难破，国产替代窗口正在打开。2019年全球SiO2含量
      99.995%以上的高端高纯石英产量仅14.0万t，占全部高纯石英产量的11.0%，
      且产能高度集中于海外少数企业。对照国内正在推进的多处伟晶岩型矿点勘查
      进展，预计未来三年国内将形成首批万吨级原料供给能力。
  - kind: text
    text: |
      需求端韧性超出供给端弹性。预计到2025年，我国4N级及以上高纯石英需求
      将达38.31万t；相比之下，国内已查明可采资源近乎空白，缺口只能依赖进口
      与技术攻关双轮弥补。需关注提纯环节的工业化验证进度。
source: built-in
