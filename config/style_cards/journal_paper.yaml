id: journal_paper
name: 期刊论文体
desc: 学术综述形态：客观陈述、数据先行、段落充实、无口语
rules: |
  - 概括陈述为主，禁用第一人称与感叹语气；每段一个论点，段首给出判断句。
  - 数字必须带年份与口径（"截至2019年""按××统计"），无出处的数值一律不写。
  - 论证结构：背景/意义 → 现状与数据 → 差距或问题 → 影响与对策；因果与对比
    优先于罗列。
  - 用词正式："综上""与此同时""相对"可用；网络用语、口语词（"其实""说实话"）
    禁用。
  - 段落充实（每段 120~250 字），不写一句话段落；节与节之间不重复开头套话。
excerpts:
  - kind: text
    text: |
      高纯石英是半导体、光伏与光纤产业的关键基础材料，其品质高度依赖矿石中
      气液包裹体与杂质元素的控制水平。截至2019年，全球高纯石英产量约123.62万t，
      其中SiO2含量不低于99.995%的高端产品仅占11.0%，供给呈现明显的结构性集中。
      我国原料矿石对外依存度长期偏高，落实优质矿源、建立自主提纯技术体系，
      已成为资源保障的核心命题。
  - kind: text
    text: |
      从成矿条件看，区域变质作用与后期热液改造的叠加程度，决定了石英包裹体
      的发育密度与流体组成。一般认为〔400～600℃〕的成岩温度区间更有利于高纯
      石英的形成，因此在勘查评价中应优先关注变质基底出露区与伟晶岩脉密集带，
      并结合加工性能试验落实工业指标。
source: built-in
