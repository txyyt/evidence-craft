id: exec_brief
name: 决策简报体
desc: 简报形态：短段落、要点化、直接给结论与建议、信息密度高
rules: |
  - 直给结论：每节开头一两句话给出核心判断或建议，随后至多两段展开依据。
  - 要点化表达：可用"一是……二是……三是……"句式列举；每条一行业务判断，
    不做长句嵌套。
  - 数据点到为止：只引支撑判断的关键数值（带年份与来源口径），不堆砌明细。
  - 语言克制、动词有力："建议""需""应"引导行动项；禁用渲染性形容词。
  - 段落短（60~150 字），全篇不写过渡套话与总结套话。
excerpts:
  - kind: text
    text: |
      国内高纯石英找矿已到关键验证期。一是新矿种确立后，勘查与矿业权设置
      进入规范化通道；二是多地伟晶岩型石英矿点完成初查，样品提纯后可达
      99.99%级；三是提纯工艺的能耗与收率仍是产业化主要制约。建议优先支持
      "矿点评价＋提纯中试"一体化项目。
  - kind: text
    text: |
      供给风险仍需高位应对。2019年全球高端产量14.0万t、占比仅11.0%，来源
      高度集中；一旦供应链波动，国内光伏与半导体坩埚环节将首当其冲。建议
      将高纯石英纳入战略性矿产资源储备序列，并明确接续资源勘查专项资金。
source: built-in
