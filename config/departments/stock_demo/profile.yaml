# 部门 profile：stock_demo（股票研报，内置回归部门）
# 结构（报告模板）与资源（数据源/词表/规则）正交：本文件只描述资源。
department: stock_demo
description: 股票研报试跑场景（东财公开数据，平台能力的第一个验证场）

params_schema:
  stock: 股票代码

# 行业术语（原 spec 的 industry_keywords 迁移至此；供 em_industry_news 扫描）
vocabulary:
  industry_keywords: [UCO, 工业级混合油, 生物柴油, SAF, 可持续航空燃料,
                      废弃油脂, 餐厨, 废油脂, CORSIA]

# 部门特性开关（流水线消费）
features:
  kline_chart: true          # 报告头图：指数K线

# 交叉校验（数据层内部一致性）
crosschecks: [financial_dual_source]

# judge 对标范文（部门级缺省；模板 spec 可覆盖）
judge_reference: config/reference/company_review_guosen_000803.md

# 数据绑定：spec 槽位的 data_needs → adapter（need 名与 spec 对齐）
bindings:
  - {need: quote_snapshot,         adapter: em_quote,         params: {stock: $stock}}
  - {need: financial_periods,      adapter: em_financial,     params: {stock: $stock}}
  - {need: peer_compare,           adapter: em_peer,          params: {board_code: $ctx.board_code}}
  - {need: key_announcements,      adapter: em_announcement,  params: {stock: $stock}}
  #    ^ spec 的 catalyst_announcements / long_announcement_digest 均由本绑定供数
  - {need: industry_news,          adapter: em_industry_news, params: {keywords: $vocabulary.industry_keywords}}
  - {need: consensus_forecast,     adapter: em_consensus,     params: {stock: $stock}}
  - {need: business_composition,   adapter: em_mainop,        params: {stock: $stock}}
  - {need: financial_statements,   adapter: em_statements,    params: {stock: $stock}}
  - {need: stock_news,             adapter: em_news,          params: {stock: $stock}}
