writing_rules:
- 以公开研究资料为口径，图表与正文数字必须标注年份
- 优先采用近三年（2023—2025）最新数据，旧数据须注明
- 关键指标给出量化区间或增长率，避免纯定性描述
- 图表与正文数据一致，不重复罗列已有图表中的数字
forbidden_words:
- 非常
- 极其
- 绝对
- 众所周知
- 我觉得
- 我们认为
