writing_rules:
- 口吻客观克制，以数据和事实为依据，避免情绪化与夸张表述
- 政策与数据均注明时间口径与来源
- 每节围绕核心论点展开，不做无依据推测，定性判断需有数据或政策支撑
- 全文字数控制在3000字左右（±10%）
forbidden_words:
- 非常
- 极其
- 绝对
- 众所周知
- 震惊
- 爆发式
