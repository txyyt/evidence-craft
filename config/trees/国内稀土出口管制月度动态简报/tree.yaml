version: 2
description: 按月梳理国内稀土出口管制政策动向、市场与价格变化，并给出克制的结论与建议。
writer_role: 产业政策分析师
title_style: 简式标题：『年月+主题』，如《2025年X月国内稀土出口管制动态简报》
title_check: {}
sections:
- id: 政策动向
  title: 政策动向
  kind: text
  style: 按时间顺序列举本月商务部、海关总署等机构关于稀土出口管制的政策发布与调整，逐条说明发布机构、日期、核心内容，300~500字，克制陈述不加评价。
  data_needs:
  - 本月稀土出口管制新政策
  - 政策发布机构与发文日期
  - 管制物项与技术参数调整
  - 许可与审批流程变化
  origin: user
  check: {}
  heading: 1　政策动向
  inline: false
  view_slots: []
  charts: []
- id: 市场与价格
  title: 市场与价格
  kind: text
  style: 陈述本月氧化镨钕等主要稀土产品价格走势、出口量变化及海外市场反应，数据注明统计口径与时间区间，400~600字，不作涨跌归因的过度推断。
  data_needs:
  - 主要稀土产品月度价格
  - 稀土出口量与出口许可数据
  - 海外供需与替代动态
  - 行业企业应对动向
  origin: user
  check: {}
  heading: 2　市场与价格
  inline: false
  view_slots: []
  charts:
  - id: price_trend
    title: 本月主要稀土产品价格走势
    type: line
    source: facts:rag
    y: []
    unit: 万元/吨
    note: ''
    bins: 10
- id: 环保政策
  title: 环保政策
  kind: text
  style: 按时间顺序列举本月生态环境部、工信部等机构涉及稀土开采、冶炼分离的环保政策与监管行动，逐条注明发布机构、日期、核心内容，200~400字，克制陈述不加评价。
  data_needs:
  - 本月稀土行业环保监管新政策
  - 矿山开采与冶炼环保要求
  - 环保督察与整治行动
  origin: user
  check: {}
  heading: 3　环保政策
  inline: false
  view_slots: []
  charts: []
- id: 结论建议
  title: 结论建议
  kind: text
  style: 基于前两节事实给出3条以内结论与2~3条可执行建议，每条一段，200~350字，语气克制、可核可选，不引入前文未提数据。
  data_needs:
  - 政策走向研判要点
  - 市场风险关注点
  - 合规与供应链建议依据
  origin: user
  check: {}
  heading: 4　结论建议
  inline: false
  view_slots: []
  charts: []
tables: []
writing_rules:
- 克制陈述，只述事实与可核数据，不做渲染
- 政策条目注明发布机构与日期，价格注明口径与区间
- 结论与建议须与前文事实对应，不引入新数据
forbidden_words:
- 非常
- 极其
- 绝对
- 众所周知
- 啊
- 呢
