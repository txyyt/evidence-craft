writing_rules:
- 采用期刊综述文体：客观陈述、文献与数据佐证、避免营销化表述
- 段落间逻辑衔接，用“研究表明/资料显示”等转述句式
- 全文总篇幅控制在 6000~8000 字
- 数据注明年份与口径；矿点信息须具体到矿区名称与发现时间
