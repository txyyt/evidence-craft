writing_rules:
- 数据必须给出具体数值与年份/时间口径，注明数据来源
- 图表紧贴正文论证，先文后图，图不超过6张、表不超过3张
- 时效性要求：优先采用2024-2026年数据，明确数据截止时间
- 行业术语首次出现给简短定义
- 预测数据须给出预测方法或依据
