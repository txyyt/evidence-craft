writing_rules:
- 口吻客观克制，以数据与事实为主，避免主观推断
- 全文控制在2800-3200字
- 数据口径以国家统计局、协会、行业资讯与企业公告为准，注明时间范围
- 价格、供需数据须标注单位与统计期
- 风险提示部分只陈述风险因素，不给出投资建议
