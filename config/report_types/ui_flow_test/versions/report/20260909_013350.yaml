writing_rules:
- 标题采用[H1]/[H2]层级结构，标题可含关键数字与结论
- 同比表述用'同比增长X.XX%'或简写'同比+X.XX%'，增速保留两位小数
- 金额单位为亿元，保留原始精度（如7.3538亿元），正文摘要有两位小数（7.35亿元）
- 比例类指标（毛利率、ROE、占比）保留4位小数或按原文精度（如29.15%、39.5148%）
- EPS、PE等预测值按'N家券商预测均值'一致预期口径，并注明计算现价
- 专有名词（公司名、行业名、监管文号）须与来源一致，监管文件引用含文号（如证监许可〔2026〕2190号）
- 每条事实须可溯源，文末附数据溯源表，含事实编号、指标、值、来源、截至时间
- 风险提示以分号分隔的短语列表结尾
- 评级结论基于盈利与估值路径描述，不使用主观煽动性措辞
- 预测表格字段使用'今年/明年/后年'相对时间表述
