  - id: overall_performance
    brief: 总结式呈现公司整体经营业绩：以营收、归母净利润及同比增速为核心数据，突出收入与利润增速的剪刀差，并补充毛利率、ROE、每股收益等盈利质量指标，最后归因于毛利率修复。
    data_needs:
    - 营收利润
    - 盈利质量
    fallback: []
    fewshot: 2026年上半年公司实现营业收入7.35亿元，同比增长2.62%；归母净利润0.65亿元，同比增长60.47%，利润增速显著高于收入增速，呈现明显的剪刀差。盈利质量同步改善：综合毛利率为29.15%，加权平均净资产收益率为4.4%，基本每股收益为0.14元。
  - id: segment_structure
    brief: 分产品与分地区拆解收入结构：用各业务收入占比与毛利率对比论证油脂业务的高毛利引擎地位，再用区域毛利率对比说明境外贡献较高毛利，论证收入与利润协同。
    data_needs:
    - 收入占比
    - 分部毛利率
    fallback: []
    fewshot: 分产品看，油脂产品加工和销售收入3.6114亿元，占比49.1096%，毛利率39.5148%，显著高于供暖业务的29.3704%和环保无害化处理的10.0572%，是公司盈利核心引擎，三大主业形成收入与利润协同。
  - id: industry_drivers
    brief: 阐述行业景气度向业绩的传导逻辑：引用募集说明书扣非净利增速及价格上涨、自产比例提升等驱动因素，说明工业级混合油的应用前景，并提示价格波动风险。论证结构为'驱动归因+行业逻辑+风险提示'。
    data_needs:
    - 扣非增速
    - 产品价格
    - 风险因素
    fallback: []
    fewshot: 据募集说明书披露，公司扣除非经常性损益的净利润同比增长54.74%、43.96%，主要系工业级混合油市场价格上涨、自产油脂比例提升、标准化体系建设提升运营效率及降本增效成果显著等综合原因导致。
  - id: capital_catalysts
    brief: 描述资本运作进展与未来增量：陈述定增获批的批复文号、发行规模上限，说明产能释放与资金支持的逻辑，补充外延收购事项及其不确定性，形成'事件+影响+风险'结构。
    data_needs:
    - 定增批复
    - 产能规划
    - 收购事项
    fallback: []
    fewshot: 公司近日收到中国证监会《关于同意山高环能集团股份有限公司向特定对象发行股票注册的批复》（证监许可〔2026〕2190号），本次发行数量不超过127,261,793股、不超过发行前总股本的30%。
