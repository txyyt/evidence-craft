writing_rules:
- 标题层级使用[H2]/[H3]/[H4]编号体系（如4、1.1、2.2.1）
- 图件须编号并附中文图题，部分图题附英文对照（如Fig. 2）
- 纯度以百分比加等级双重表示（如99.99%（4N））
- 年份区间用一字线连接（如2018—2023年）
- 作者姓名间用全角空格（如张　亮）
- 机构署名带编号上标并列全称及地址邮编
- 摘要采用'通过……分析得出：①②③'的编号式结论表述
- 附中图分类号、文献标识码、文章编号、DOI、引用格式、基金项目、作者简介、收稿日期等期刊元数据
- 摘要末以'以期……'式目的句收尾
- 专有名词首次出现附英文缩写（如高纯石英（HPQ））
forbidden_words:
- 我
- 我们
- 笔者认为
- ！
- 极
- 最最优
- 毫无疑问
- 惊人
- 绝对
