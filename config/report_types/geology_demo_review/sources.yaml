name: 地质勘查进展（演示）
description: 地学演示部门（合成矿区 GM-1），验证多部门机制与数据源插件化
status: published
params_schema:
  project: 项目编号
  period: 期次
vocabulary: {}
features:
  kline_chart: false
crosschecks: []
judge_reference: config/reference/geology_demo_reference.md
bindings:
- need: drilling_summary
  adapter: sqlite_query
  params:
    db_ref: assay_db
    query: SELECT 孔号, 项目, 期次, 进尺, 见矿段数, 采样日期 FROM drill_summary WHERE 项目 = :project
      AND 期次 = :period
    query_params:
      project: $project
      period: $period
    id_prefix: drilling
    id_column: 孔号
    name_template: '{项目} {孔号} 钻探进尺'
    value_columns:
    - column: 进尺
      key: footage
      unit: m
    - column: 见矿段数
      key: minzones
      unit: 段
    as_of_column: 采样日期
- need: assay_summary
  adapter: xlsx_table
  params:
    path: data/geology_demo/assay_ledger.xlsx
    sheet: 化验台账
    id_prefix: assay
    id_column: 样品号
    name_template: '{孔号} {样品号} 化验'
    value_columns:
    - column: Au品位
      key: au
      unit: g/t
    - column: 矿段厚度
      key: thickness
      unit: m
    as_of_column: 采样日期
    table_columns:
    - 孔号
    - 样品号
    - Au品位
    - 矿段厚度
    table_id: assay_table
- need: norms_reference
  adapter: rag_client
  params:
    query: 岩金矿 工业指标 资源量估算
    mock_fragments: data/geology_demo/norms_fragments.json
    top_k: 3
