writing_rules:
  - 正文数字必须能在事实切片中找到出处，对账层将逐一对账
  - 禁止对事实数字做任何计算——合计、倍数、占比、差值、平均一律不得出现
  - 数值保留事实切片的原始精度与单位；百分比不与绝对量混算
  - 同一指标存在多年份数值时，正文必须标注年份与口径（如"2019年全球产量"），
    不同年份数值不得混写比较
  - 矿床学表述与范文一致：脉石英、花岗伟晶岩、石英岩、天然水晶
  - 本报告数据一律以绑定事实切片为准：范文或背景素材中的数字年份口径不同，
    不得作为正文数值来源，也不得因口径差异质疑事实数据
  - 段落不得以"总体而言""综上所述""总的来说"等套话开头或收尾
  - 正文不得出现"事实切片""切片口径""按一位小数记录""对账"等系统处理
    过程的元话语，数字直接给出、不做来源自注
  - 同类数值（品位/储量/占比）至多引用两三个作代表，其余用定性概括；
    数字必须服务于论点（支撑一个判断），禁止连续罗列多组同口径数值
  - 空间尺度数值（长度/宽度/深度/面积）必须与其所属矿床/矿带/地区绑定
    表述，禁止把某一矿床的尺度数值复用到其他地区
  - 涉及统计范围（省份数量、合计值、占比）的表述必须与本章表图完全一致，
    不得引入文献中统计范围不同的占比数据（如"六省占97%"类口径混写）

