# 报告规格 v2：国内高纯石英研究报告（hp_quartz_review）
# 结构严格复刻《我国高纯石英资源勘查开发现状及思考》（中国矿业 2025）：
# 摘要 + 0 引言 / 1 市场供需及资源保障（1.1 市场供需、1.2 资源保障）/
# 2 勘查开发现状（2.1 成矿机理研究现状、2.2 找矿勘查与加工技术现状）/
# 3 找矿勘查面临主要问题（3.1~3.5，观点槽位）/ 4 思考与建议。
# 与研报形态的差异：无"核心观点"章（views 只是可选章节类型，此处用作问题章）、
# 无独立图表章节（图表内嵌正文）、无风险提示章（期刊论文形态）。
report_type: hp_quartz_review
version: 2
description: 国内高纯石英矿产资源研究综述（期刊论文形态）：市场供需、资源保障、勘查开发现状、主要问题与对策建议
writer_role: 资深非金属矿产地质调查研究员

title_style: |
  论文式短语标题，结构对标范文《我国高纯石英资源勘查开发现状及思考》：
  "我国高纯石英资源……现状及思考/与建议"式，15~30 字，不用逗号判断句，
  不用书名号，不得与范文标题完全相同。
  范例："我国高纯石英资源勘查开发现状与对策建议"

title_check:
  title_len: [12, 34]

sections:
  - id: abstract
    title: 摘要
    heading: "摘　要"
    kind: text
    style: |
      按学术论文摘要写一段 220~420 字：高纯石英的战略意义→我国资源与供需
      形势→找矿勘查取得的主要进展→制约勘查的关键问题（点出 3~4 个）→
      建议方向（方法研发、工业指标、提纯技术、勘查规范）。概括陈述，不展开论证。
    fewshot: |
      【范文摘要】高纯石英资源是一种重要的关键非金属资源和战略新兴产业的关键
      基础材料，在光伏、半导体、光纤等领域应用广泛，需求旺盛。我国是全球最大的
      高纯石英消费国，但我国高纯石英资源稀缺，原料矿石对外总体依存度高，亟需
      通过国内资源地质找矿和勘查工作，保障资源安全供给。通过系统总结近年来我国
      高纯石英资源地质找矿和勘查开发现状……针对高纯石英资源特点和找矿勘查存在
      问题，从高效勘查方法研发、矿床一般工业指标制定、选矿提纯加工技术研发、
      地质勘查规范编制等方面提出相应对策建议。
    check:
      body_len: [220, 500]

  - id: keywords
    title: 关键词
    heading: "关键词"
    kind: text
    style: |
      只输出一行关键词：3~6 个，用中文分号分隔，不加句号，不写其他文字。
      关键词覆盖本报告主题（资源、供需、勘查、工业指标、规范等维度）。
    fewshot: |
      【范文关键词】高纯石英；市场现状；地质勘查；工业指标；勘查技术
    check:
      body_len: [8, 60]

  - id: introduction
    title: 引言
    heading: "0　引言"
    kind: text
    style: |
      交代背景与写作目的：高纯石英的定义与性能特性→应用领域（光伏/半导体
      坩埚、光纤、光学等）与战略地位→我国消费国地位与资源稀缺、对外依存→
      高纯石英矿列为新矿种的政策进展（引用联网事实）→本文系统总结的内容。
      本节不引用任何消费结构或市场占比数据（该内容只在 1.1 市场供需论述，
      两处并存会被视为口径矛盾），不做需求总量展开。写 2~3 个自然段。
    fewshot: |
      【范文节选】高纯石英具有耐高温、纯度高、化学稳定性高、透光率高、热膨胀
      系数低等优异的物理化学特性，可以用于制作光伏级坩埚、半导体级坩埚、光纤、
      超高功率光源玻璃、航空玻璃等高新技术产品，是新一代信息技术产业、新能源
      产业、新材料产业等战略性新兴产业必不可缺的关键基础材料。近年来，随着
      战略性新兴产业快速发展，国家和行业对高纯石英资源等战略性资源保障问题
      越来越重视，目前高纯石英矿也已正式列为我国第174个矿种。
    check:
      body_len: [300, 700]

  - id: market_supply
    title: 市场供需
    heading: "1　市场供需及资源保障"
    subheading: "1.1　市场供需"
    kind: text
    style: |
      综述需求与消费结构：战略性新兴产业拉动需求增长→分领域消费占比
      （与"应用消费结构"表和饼图完全一致）→全球消费国集中度→供给端垄断
      格局（Spruce Pine 体系、海外企业）。消费占比数据一律以"高纯石英应用
      消费结构"表（张海啟，2022，《矿产保护与利用》）为唯一口径，禁止引入
      "石英玻璃市场结构"等其他口径的占比数字并列陈述；数字带年份，与表图
      一致。写 2~3 个自然段。
    charts:
      - id: chart_consum
        title: 我国高纯石英应用消费结构
        type: pie
        source: table:consum_table
        x: 应用领域
        y: [用量占比(%)]
        unit: "%"
        note: 数据来源：张海啟（2022），《矿产保护与利用》
    fewshot: |
      【范文节选】随着战略性新兴产业尤其是光伏产业的快速发展，高纯石英需求
      快速增长。全球高纯石英砂需求量主要用于光伏、半导体、电光源、光纤、光学
      等五大领域。在高纯石英各个消费领域中，光伏领域用量占比约52.81%、半导体
      领域用量占比约20.59%、电光源领域用量占比约12.22%、光纤领域用量占比约
      5.56%、光学领域用量占比约4.63%，光伏和半导体领域用量超过70%。全球高纯
      石英砂消费主要集中在中国、德国、日本、美国等国家。
    check:
      body_len: [350, 850]

  - id: table_consumption
    title: 高纯石英应用消费结构
    kind: table
    inline: true
    table: consum_table
    style: |
      表格由系统从资料库直接生成，你只写一段 60~140 字说明文字：
      点出占比最高的应用领域与结构特征；文字中引用的数字必须与表格一致。
    check:
      body_len: [60, 140]

  - id: resource_guarantee
    title: 资源保障
    subheading: "1.2　资源保障"
    kind: text
    style: |
      综述资源保障形势：全球资源分布（美国、印度、巴西、俄罗斯等）与矿床
      类型（花岗伟晶岩型、脉石英型）→坩埚内层砂供应垄断（Spruce Pine）→
      我国资源稀缺、对外依存度高→国内已开发利用类型以脉石英为主及其分布
      （与"分省资源储量"表一致）→中低端应用为主的现状。写 2~3 个自然段；
      矿产地品位等同类数据至多引两三个代表值，用"品位特征→说明什么"的
      归因句式组织，禁止清单式罗列。
    charts:
      - id: chart_prov
        title: 主要省区脉石英资源储量
        type: bar
        source: table:prov_table
        x: 省区
        y: [资源储量(万t)]
        unit: 万t
        note: 数据来源：张海啟（2022），《矿产保护与利用》
    fewshot: |
      【范文节选】全球高纯石英资源分布不均，主要分布在美国、印度、巴西、
      俄罗斯等国家，主要矿床类型为花岗伟晶岩型、脉石英型和水晶等。目前全球
      高纯石英坩埚内层砂几乎100%来自美国Spruce Pine花岗伟晶岩型矿床。我国
      高纯石英资源稀缺，原料矿石对外依存度高。国内已发现并开发利用的高纯
      石英矿石类型主要为脉石英，主要分布在湖北、安徽、四川、甘肃、陕西等地，
      这些矿石主要被用于制备小尺寸石英管、硅微粉初级材料等中低端制品。
    check:
      body_len: [350, 850]

  - id: table_provinces
    title: 主要省区脉石英资源储量
    kind: table
    inline: true
    table: prov_table
    style: |
      表格由系统从资料库直接生成，你只写一段 70~160 字说明文字：
      点出储量领先的省区与集中度特征；文字中引用的数字必须与表格一致。
    check:
      body_len: [70, 160]

  - id: table_companies
    title: 全球主要高纯石英生产企业
    kind: table
    inline: true
    table: companies_table
    style: |
      表格由系统从资料库直接生成，你只写一段 90~170 字说明文字：
      概括企业格局（海外主导、国内追赶、产能集中度），不逐一点名企业产品
      序号或罗列全部企业；文字中的数字必须与表格单元格一致。
    check:
      body_len: [90, 200]

  - id: metallogeny
    title: 成矿机理研究现状
    heading: "2　勘查开发现状"
    subheading: "2.1　成矿机理研究现状"
    kind: text
    style: |
      综述成矿机理研究：杂质元素（Al、Ti、Li、K 等）与包裹体受岩浆性质、
      结晶条件、流体演化与后期变质作用影响→关键指标（如 Al、Ti 含量要求）
      与有利成矿条件（伟晶状花岗岩早期结晶石英、变质热液脉石英）→
      典型矿床（美国 Spruce Pine）成因认识。定性综述为主，化学式与指标
      表述对标范文；引用数据带编号。写 2~3 个自然段。
    fewshot: |
      【范文节选】前人研究表明，石英中Al、Ti、Li、Na、K、Fe、Ge，以及包裹体
      等杂质含量受初始岩浆性质、石英结晶物理化学条件、流体成分及演化等因素
      影响，此外后期的变质作用会使石英发生脆性破裂、塑性变形、物质扩散迁移
      等现象。石英矿物中关键杂质元素Al、Ti含量决定了400～600℃的成岩温度
      可能更有利于高纯石英矿物形成；通常不含暗色矿物的伟晶状花岗岩-花岗伟晶岩
      早期阶段结晶形成的石英矿物，以及变质热液形成脉石英，可能更有利于高纯
      石英矿物原料形成。
    check:
      body_len: [300, 800]

  - id: exploration_technology
    title: 找矿勘查与加工技术现状
    subheading: "2.2　找矿勘查与加工技术现状"
    kind: text
    style: |
      两条线综述：①找矿勘查——国外企业垄断勘查资料，国内起步晚、进展快
      （新疆阿尔泰、河南东秦岭伟晶岩型，江西宁都花岗岩型，安徽/陕西/山东/
      河北等地脉石英发现）；②加工技术——国外技术封锁，国内提纯加工发展快，
      规模化稳定生产高品质石英砂的企业少，科研院所提纯攻关达到的纯度等级
      （与"分纯度等级产量"图、"国内产量"图一致）。数字带年份口径，引用编号。
      写 3~4 个自然段。
    charts:
      - id: chart_grades
        title: 2019年全球分纯度等级高纯石英产量
        type: bar
        source: table:grades_table
        x: 纯度等级
        y: [2019年全球产量(万t)]
        unit: 万t
        note: 数据来源：张海啟（2022），转引联合国统计司
      - id: chart_domestic
        title: 我国4N5级及以上高纯石英产量
        type: bar
        source: table:domestic_table
        x: 年份
        y: [我国4N5级及以上高纯石英产量(万t)]
        unit: 万t
        note: 2022 年为文献预计值（6万t 以上）
    fewshot: |
      【范文节选】我国高纯石英资源地质找矿起步较晚，虽然在花岗伟晶岩型资源
      和脉石英型资源地质找矿方面取得系列重要进展，但仍未实现规模化开发利用。
      中国地质科学院郑州矿产综合利用研究所先后在新疆阿尔泰、河南东秦岭等
      地区新发现高纯石英潜力资源多处，提出新疆阿尔泰地区、河南东秦岭地区是
      我国高纯石英重要潜在资源基地。相较国外，我国高纯石英生产企业的提纯
      加工技术起步晚、发展快，已形成了较为成熟的提纯加工和材料制备技术，
      但能够规模化稳定生产高品质的石英砂产品仅有少数龙头企业。
    check:
      body_len: [400, 1000]

  - id: problems
    title: 找矿勘查面临主要问题
    heading: "3　找矿勘查面临主要问题"
    kind: views
    view_numbering: "3"
    n_views: 5
    view_style: |
      每条 = 问题小标题（8~20 字判断句，可直接沿用槽位对应的问题表述）+
      一段论述（单条 220~380 字，宁短勿长，写完自查字数）。论述结构对标
      范文：问题表现→成因→制约后果，一气呵成，不做多层"从……层面看"
      式堆叠，同一论据不得跨条重复使用。以定性论述为主，一般不出现数字；
      确需数据支撑时引用事实编号并带年份口径。不用"我们"，不用感叹号。
    check:
      heading_len: [8, 24]
      body_len: [160, 400]
    view_slots:
      - id: field_identification
        brief: 野外快速识别标志不明：可加工高纯石英的原料矿石野外识别判别
               标志缺乏，仍依赖颜色、透明度等经验定性判断，大量不合格样品
               进入选冶试验，找矿效率低下。
        fewshot: |
          【范文 3.1】目前可以加工高纯石英的岩石类型主要包括花岗伟晶岩、脉石英、
          水晶等，其中花岗伟晶岩和脉石英在我国分布广泛、数量庞大，对所有发现的
          岩石样品开展选冶提纯实验、高精度化学分析以及材料评价工作是不现实的，
          需要在早期找矿勘查阶段通过野外快速识别标志和技术筛选绝大部分不合格
          样品。由于深入研究欠缺、典型矿床和矿石解剖研究相对缺乏，高纯石英
          原料矿石野外快速识别判别标志不明，仍多依赖工作经验定性判断，导致
          大量不合格伟晶岩、脉石英被用作选冶评价试验，找矿效率低下。
        data_needs: [corpus_exploration]
      - id: exploration_methods
        brief: 缺乏适用的勘查方法组合：常规遥感、电法、磁法等手段对高纯石英
               矿体边界、连续性、品质识别有效性差，亟需高效方法组合。
        fewshot: |
          【范文 3.2】虽然利用遥感解译、电法、磁法等方法可以在一定程度上实现
          脉状矿体大尺度识别和岩体轮廓的圈定，但对于高纯石英矿体的边界、矿体
          连续性、品质、形态等特征识别和控制而言，单独的遥感、重力、电法、
          磁法等方法在高纯石英勘查过程中的有效性较差，制约高纯石英资源矿体
          圈定和规模控制，亟需研发更为有效的方法和手段组合。
        data_needs: [corpus_exploration]
      - id: industrial_index
        brief: 一般矿床工业指标未制定：现有石英指标针对常规硅质原料，高纯
               石英价值高、技术要求特殊（ppm 级杂质），矿体圈定与资源量
               估算无依据。
        fewshot: |
          【范文 3.3】现有的石英资源一般矿床工业指标主要针对硅质原料类，
          数量级通常为百分含量。与传统硅质原料相较，高纯石英矿石价格远高于
          常规原料，对杂质要求通常是ppm级别，决定矿石质量的因素还包括包裹体、
          羟基等多个要素。由于以往高纯石英矿并不是单独的矿种，目前我国还没有
          专门针对高纯石英资源制定相应一般矿床工业指标，导致找到高纯石英资源
          矿体圈定困难、资源量估算无依据的窘迫现状。
        data_needs: [corpus_exploration]
      - id: techno_economic
        brief: 技术经济评价工作困难：选冶提纯试验工艺复杂、彼此保密不可参考，
               勘查阶段难以合理开展试验并准确评价技术经济可行性。
        fewshot: |
          【范文 3.4】通常未加酸浸、氯化、材料评价等流程的常规选矿试验并不能
          确定高纯石英矿石最终可加工性。同一种矿石不同的应用方向和产品类型
          所用的矿石加工工艺、处理流程、药剂制度并不相同，如何设计高纯石英
          选矿提纯试验、如何定位产品以保证资源价值最大化，均是各企业和科研
          机构的核心技术，存在一定壁垒性。矿石加工选冶试验复杂性和不可参考性，
          决定了目前在地质勘查过程中很难合理开展选冶提纯试验，准确开展技术
          经济评价。
        data_needs: [corpus_exploration]
      - id: exploration_code
        brief: 地质勘查规范欠缺：高纯石英已列为新矿种但专门勘查规范未出台，
               勘查类型确定、资源储量估算方法等关键问题无标准可依。
        fewshot: |
          【范文 3.5】目前已正式将高纯石英矿列为我国第174个矿种，亟需开展
          相应的地质勘查工作，但针对性的高纯石英地质勘查规范并未出台。目前
          唯一相关的地质矿产行业标准为《高纯石英用硅质原料评价工作指南》
          （DZ/T 0467—2024），更多是针对矿石质量判断和工作流程等矿石评价
          层面内容。矿床勘查类型如何确定、矿产资源储量估算方法适用性如何等
          系列关键问题仍未解决，导致地质勘查过程存在无标准可依等问题。
