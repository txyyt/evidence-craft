name: 个股点评（演示）
description: 股票研报试跑场景（东财公开数据，平台能力的第一个验证场）
status: published
params_schema:
  stock: 股票代码
vocabulary:
  industry_keywords:
  - UCO
  - 工业级混合油
  - 生物柴油
  - SAF
  - 可持续航空燃料
  - 废弃油脂
  - 餐厨
  - 废油脂
  - CORSIA
features:
  kline_chart: true
crosschecks:
- financial_dual_source
judge_reference: config/reference/company_review_guosen_000803.md
bindings:
- need: quote_snapshot
  adapter: em_quote
  params:
    stock: $stock
- need: financial_periods
  adapter: em_financial
  params:
    stock: $stock
- need: peer_compare
  adapter: em_peer
  params:
    board_code: $ctx.board_code
- need: key_announcements
  adapter: em_announcement
  params:
    stock: $stock
- need: industry_news
  adapter: em_industry_news
  params:
    keywords: $vocabulary.industry_keywords
- need: consensus_forecast
  adapter: em_consensus
  params:
    stock: $stock
- need: business_composition
  adapter: em_mainop
  params:
    stock: $stock
- need: financial_statements
  adapter: em_statements
  params:
    stock: $stock
- need: stock_news
  adapter: em_news
  params:
    stock: $stock
