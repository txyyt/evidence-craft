  view_slots:
  - id: overall_profit_analysis
    brief: 概述公司整体收入和利润情况，重点论证利润增长主要由毛利率修复驱动，辅以财务费用下降的贡献。使用营业收入、归母净利润、毛利润、毛利率、财务费用等数据，通过同比变化和利润率提升来支撑核心观点。
    data_needs:
    - 营业收入
    - 归母净利润
    - 毛利率
    - 财务费用
    fallback: []
    fewshot: 收入温和增长，利润增长主要由毛利率修复驱动。 2026H1公司实现营业收入7.35亿元，同比增长2.62%；归母净利润0.65亿元，同比增长60.47%。从利润表拆分看，公司H1毛利润约2.14亿元，同比增加约0.42亿元；综合毛利率29.15%，同比提升5.11pct。与此同时，财务费用由0.63亿元下降至0.56亿元，同比下降10.60%，也是利润改善的重要贡献。
  - id: segment_margin_analysis
    brief: 从分业务角度分析毛利率大幅改善的原因，聚焦自产油脂比例提升带来的成本下降和毛利率提升。使用分业务收入、成本、毛利率及其同比变化数据，说明主动降低低附加值贸易油业务、提高自产占比的举措。
    data_needs:
    - 分业务收入
    - 分业务成本
    - 毛利率
    - 业务占比
    fallback: []
    fewshot: 自产油脂比例提升带动毛利率大幅改善。 分业务看，2026H1公司油脂产品加工和销售收入3.61亿元，同比下降2.46%，但营业成本同比大幅下降20.90%，毛利率达到39.51%，同比提升14.10pct，主要系公司主动降低低附加值外采贸易油业务、提高自产油脂占比所致。
  - id: uco_price_and_policy
    brief: 论述工业级混合油（UCO）价格高位运行及CORSIA第二阶段政策对需求的催化作用。使用UCO出口均价、同比环比数据、价格历史分位数，以及CORSIA纳入中国等政策事件，论证废弃油脂行业景气度有望维持。
    data_needs:
    - UCO价格
    - 出口均价
    - 同比环比
    - CORSIA政策
    fallback: []
    fewshot: 工业级混合油（UCO）价格高位运行，CORSIA第二阶段催化需求。 受益于国内SAF工厂陆续投产开工及航运旺季到来欧盟需求增加，工业级混合油（UCO）价格呈现上涨态势。2026年7月中国出口工业级混合油（UCO）的均价为1147.1美元/吨，达到近三年以来的价格高点，同比2025年7月增长8.8%，环比2026年6月几乎持平，价格分位数达到历史48%。2027年国际航空业碳抵消与削减机制（CORSIA）第二阶段将正式启动，2026年7月16日中国已被正式纳入CORSIA成员国，废弃油脂资源化利用行业景气度有望维持。
  view_style: 每段以加粗小标题开头，直接点明核心观点；正文以数据论证为主，先总后分，逻辑严密；字数分布不均，中段约184字，短段约134字，长段约259字；语气客观专业，使用百分比、同比环比等财务分析语言。
